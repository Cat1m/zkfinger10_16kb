name: zkfinger10_16kb
description: ZKTeco fingerprint scanner plugin (enroll, identify, verify) for Android, patched to run on 16 KB page size devices. Fork of zkfinger10.
version: 1.0.0
homepage: https://github.com/Cat1m/zkfinger10_16kb
repository: https://github.com/Cat1m/zkfinger10_16kb
issue_tracker: https://github.com/Cat1m/zkfinger10_16kb/issues
topics:
  - fingerprint
  - zkteco
  - biometrics
  - android
  - page-size-16kb

environment:
  sdk: '>=3.1.0 <4.0.0'
  flutter: '>=3.35.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: io.github.cat1m.zkfinger10_16kb
        pluginClass: ZkFinger10Plugin
